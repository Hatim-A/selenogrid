<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090c" />
    <meta
      name="description"
      content="SelenoGrid compares lunar south-pole landing sites using real LOLA terrain, sunlight, Earth visibility and a transparent TOPSIS decision layer."
    />
    <title>SelenoGrid · Lunar landing site lab</title>
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('selenogrid-theme')
          if (saved === 'light') document.documentElement.classList.remove('dark')
          else document.documentElement.classList.add('dark')
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
