<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta
      name="description"
      content="SelenoGrid compares Artemis lunar south-pole landing sites with real LOLA terrain, sunlight and Earth-visibility physics, ranked by a transparent model you can inspect."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SelenoGrid: Lunar South Pole Observatory" />
    <meta
      property="og:description"
      content="Compare Artemis landing sites with real LOLA terrain, sunlight and Earth-visibility physics, ranked by a transparent model."
    />
    <title>SelenoGrid: Lunar South Pole Observatory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('selenogrid-theme')
          if (saved === 'light') document.documentElement.classList.remove('dark')
          else document.documentElement.classList.add('dark')
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
